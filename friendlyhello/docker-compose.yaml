services:
  web:
    image: marshallgomez1103/friendlyhello:0.1.0
    ports:
      - "4000:8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8.8
    command: redis-server --appendonly yes
    volumes:
      - ./data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
